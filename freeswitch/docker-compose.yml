services:
  freeswitch:
    build:
      context: .
      dockerfile: Dockerfile
    image: heyhank-freeswitch:latest
    container_name: heyhank-freeswitch
    restart: unless-stopped
    network_mode: host  # SIP needs many ports (5060, RTP range)
    volumes:
      - ./conf:/etc/freeswitch/custom
      - ./sounds:/usr/local/freeswitch/sounds/custom
      - ./recordings:/var/lib/freeswitch/recordings
      - ./scripts:/usr/local/freeswitch/scripts/custom
    environment:
      - FREESWITCH_DOMAIN=${FREESWITCH_DOMAIN:-127.0.0.1}
      - HEYHANK_ESL_PASSWORD=${HEYHANK_ESL_PASSWORD:-heyhank_esl_secret}
